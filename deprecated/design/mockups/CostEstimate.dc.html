<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--accent, #4F5FEA); }
    a:hover { color: var(--accent, #4F5FEA); opacity: 0.8; }
    .btn { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12.5px; font-weight: 500; border-radius: 6px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg-panel); color: var(--text); }
    .btn-active { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
    .mono { font-family: 'IBM Plex Mono', monospace; }
    .row { display: flex; align-items: center; }
    .col { display: flex; flex-direction: column; }
  </style>
</helmet>
<div style="--bg-canvas:{{theme.bgCanvas}};--dot:{{theme.dot}};--bg-panel:{{theme.bgPanel}};--border:{{theme.border}};--border-strong:{{theme.borderStrong}};--text:{{theme.text}};--text-2:{{theme.text2}};--text-3:{{theme.text3}};--accent:{{theme.accent}};--accent-soft:{{theme.accentSoft}};--accent-contrast:{{theme.accentContrast}};--shadow:{{theme.shadow}}; width:1440px; height:900px; background:var(--bg-canvas); color:var(--text); font-family:'IBM Plex Sans',system-ui,sans-serif; display:flex; flex-direction:column; overflow:hidden; position:relative;">

  <!-- TOP BAR -->
  <div class="row" style="height:56px; flex:0 0 auto; border-bottom:1px solid var(--border); background:var(--bg-panel); padding:0 16px; gap:14px;">
    <div class="row" style="gap:8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="5" r="2.3"/><circle cx="19" cy="5" r="2.3"/><circle cx="12" cy="19" r="2.3"/><path d="M6.6 6.6L11 17M17.4 6.6L13 17M7.5 5h9"/></svg>
      <span style="font-size:13px; font-weight:600;">Distributed Systems Simulator</span>
    </div>
    <div style="width:1px; height:20px; background:var(--border);"></div>
    <div class="row" style="gap:6px; color:var(--text-2); font-size:13px;">
      <span>Sample E-commerce Microservices</span>
    </div>
    <div style="flex:1;"></div>
    <button class="btn">Presets</button>
    <button class="btn btn-active"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Cost estimate</button>
    <button class="btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8V4z"/></svg>Run</button>
  </div>

  <!-- BODY -->
  <div class="row" style="flex:1; min-height:0;">

    <!-- PALETTE -->
    <div class="col" style="width:220px; flex:0 0 auto; border-right:1px solid var(--border); background:var(--bg-panel); overflow:hidden;">
      <div style="padding:10px 12px; border-bottom:1px solid var(--border);">
        <div class="row" style="gap:6px; background:var(--bg-canvas); border:1px solid var(--border); border-radius:6px; padding:6px 8px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <span style="font-size:12px; color:var(--text-3);">Search components…</span>
        </div>
      </div>
      <div class="col" style="padding:10px 0; overflow-y:auto; gap:14px;">
        <div style="font-size:10.5px; font-weight:600; letter-spacing:0.06em; color:var(--text-3); padding:0 12px;">COMPONENTS</div>
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="8">
          <div class="col" style="padding:0 12px; gap:4px;">
            <div style="font-size:10.5px; font-weight:600; letter-spacing:0.06em; color:var(--text-3);">{{g.name}}</div>
            <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
              <div class="row" style="gap:8px; padding:5px 6px; border-radius:6px;">
                <img src="{{it.icon}}" width="16" height="16" style="border-radius:3px;" />
                <span style="font-size:12.5px;">{{it.name}}</span>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- CANVAS -->
    <div style="flex:1; position:relative; background-image:radial-gradient(var(--dot) 1px, transparent 1px); background-size:20px 20px; overflow:hidden;">

      <svg width="880" height="772" style="position:absolute; left:0; top:0; overflow:visible;">
        <defs>
          <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--text-3)"/>
          </marker>
        </defs>
        <path d="M206,362 L260,362" stroke="var(--text-3)" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
        <path d="M436,362 L500,362" stroke="var(--text-3)" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
        <path d="M676,362 C 700,362 700,202 720,202" stroke="var(--text-3)" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
        <path d="M676,362 C 700,362 700,502 720,502" stroke="var(--text-3)" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
      </svg>

      <sc-for list="{{nodes}}" as="n" hint-placeholder-count="5">
        <div style="position:absolute; left:{{n.x}}px; top:{{n.y}}px; width:176px; padding:10px; border-radius:9px; background:var(--bg-panel); border:1px solid var(--border); box-shadow:var(--shadow);">
          <div class="row" style="gap:9px;">
            <div class="row" style="width:30px; height:30px; border-radius:7px; background:var(--bg-canvas); border:1px solid var(--border); align-items:center; justify-content:center; flex:0 0 auto;">
              <img src="{{n.icon}}" width="17" height="17" />
            </div>
            <div class="col" style="min-width:0;">
              <span style="font-size:12.5px; font-weight:600;">{{n.name}}</span>
              <span class="mono" style="font-size:10.5px; color:var(--text-2);">{{n.type}}</span>
            </div>
          </div>
        </div>
      </sc-for>

    </div>

    <!-- COST DRAWER -->
    <div class="col" style="width:340px; flex:0 0 auto; border-left:1px solid var(--border); background:var(--bg-panel); box-shadow:var(--shadow); padding:16px; gap:14px; overflow-y:auto;">
      <div class="row" style="justify-content:space-between;">
        <span style="font-size:13.5px; font-weight:600;">Cost Estimate</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>

      <div class="col" style="gap:2px;">
        <sc-for list="{{costRows}}" as="r" hint-placeholder-count="5">
          <div class="row" style="justify-content:space-between; padding:9px 2px; border-bottom:1px solid var(--border);">
            <div class="row" style="gap:8px;">
              <img src="{{r.icon}}" width="16" height="16" />
              <div class="col">
                <span style="font-size:12px; font-weight:500;">{{r.name}}</span>
                <span class="mono" style="font-size:10px; color:var(--text-3);">{{r.detail}}</span>
              </div>
            </div>
            <span class="mono" style="font-size:12px;">{{r.cost}}</span>
          </div>
        </sc-for>
      </div>

      <div class="row" style="justify-content:space-between; padding-top:6px;">
        <span style="font-size:13px; font-weight:600;">Total</span>
        <span class="mono" style="font-size:14px; font-weight:600; color:var(--accent);">$445 / mo</span>
      </div>

      <div style="font-size:10.5px; color:var(--text-3); font-style:italic; border-top:1px solid var(--border); padding-top:10px;">Rough estimate, not a quote.</div>
    </div>

  </div>

  <!-- TIMELINE (idle) -->
  <div class="row" style="height:44px; flex:0 0 auto; border-top:1px solid var(--border); background:var(--bg-panel); padding:0 16px; gap:12px; color:var(--text-3);">
    <div class="row" style="width:26px; height:26px; border-radius:50%; border:1px solid var(--border); align-items:center; justify-content:center; flex:0 0 auto;">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="var(--text-3)"><path d="M6 4l14 8-14 8V4z"/></svg>
    </div>
    <span style="font-size:12px;">No simulation running</span>
    <div style="flex:1; height:4px; border-radius:2px; background:var(--border);"></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const theme = dark ? {
      bgCanvas:"#14161A", dot:"#22252C", bgPanel:"#1B1E24", border:"#2A2E37", borderStrong:"#383D48",
      text:"#F2F3F5", text2:"#A7ACB8", text3:"#767C8A",
      accent:"#7C87F5", accentSoft:"#262A4A", accentContrast:"#0E1020",
      shadow:"0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.45)"
    } : {
      bgCanvas:"#F4F5F7", dot:"#E2E4E9", bgPanel:"#FFFFFF", border:"#E2E4E9", borderStrong:"#D0D3DA",
      text:"#1B1E24", text2:"#6B7280", text3:"#9CA3AF",
      accent:"#4F5FEA", accentSoft:"#EEF0FE", accentContrast:"#FFFFFF",
      shadow:"0 1px 2px rgba(16,20,30,0.06), 0 4px 12px rgba(16,20,30,0.08)"
    };
    const groups = [
      { name: "CLIENT", items: [ { name: "React SPA", icon: "react.svg" } ] },
      { name: "NETWORKING", items: [ { name: "Kong", icon: "kong.svg" }, { name: "Nginx LB", icon: "nginx.svg" } ] },
      { name: "COMPUTE", items: [ { name: "Microservice", icon: "microservice.svg" }, { name: "Monolith", icon: "monolith.svg" } ] },
      { name: "DATABASE", items: [ { name: "Postgres", icon: "postgres.svg" }, { name: "Redis", icon: "redis.svg" }, { name: "Snowflake", icon: "snowflake.svg" } ] },
      { name: "MESSAGING", items: [ { name: "Kafka", icon: "kafka.svg" }, { name: "RabbitMQ", icon: "rabbitmq.svg" } ] },
    ];
    const nodes = [
      { name: "react-spa", type: "web-client", icon: "react.svg", x: 30, y: 330 },
      { name: "kong", type: "api-gateway", icon: "kong.svg", x: 260, y: 330 },
      { name: "microservice", type: "order-service · ×3", icon: "microservice.svg", x: 500, y: 330 },
      { name: "postgres", type: "orders-db", icon: "postgres.svg", x: 720, y: 170 },
      { name: "kafka", type: "order-events", icon: "kafka.svg", x: 720, y: 470 },
    ];
    const costRows = [
      { name: "web-client", detail: "static hosting", icon: "react.svg", cost: "$0" },
      { name: "api-gateway", detail: "kong", icon: "kong.svg", cost: "$45" },
      { name: "order-service", detail: "microservice · ×3", icon: "microservice.svg", cost: "$130" },
      { name: "orders-db", detail: "postgres", icon: "postgres.svg", cost: "$180" },
      { name: "order-events", detail: "kafka", icon: "kafka.svg", cost: "$90" },
    ];
    return { theme, groups, nodes, costRows };
  }
}
</script>
</body>
</html>
