id: yelp
title: Yelp
icon: map-pin
category: product
order: 10
summary: Find good places nearby; read and write reviews.
requirements:
  - Search businesses within a radius of the user, by category
  - Business page with rating and reviews; post a review
  - New reviews visible within a minute
  - 200M businesses · 100M DAU · 5 searches/user/day
  - Nearby query p99 < 100ms · 99.9% available
estimates:
  - Searches ~6k/s avg, 3× at dinner time
  - Reviews ~100/s (read:write ≈ 60:1)
  - Geo index 200M × 100 B ≈ 20 GB → fits in RAM, shard by region
designs:
  - { id: v1, title: "Naive: lat/lng range scan in Postgres", template: problem-yelp-v1 }
  - { id: v2, title: "Reference: sharded geo index + async review path", template: problem-yelp-v2 }
challenges:
  - id: dinner-rush
    title: "Dinner rush: nearby p99 < 100ms"
    template: problem-yelp-v2
    scenario:
      durationSec: 60
      sources: [{ id: searches, node: users, shape: { kind: constant, rps: 3000 }, readRatio: 0.97, keys: { kind: zipf, s: 0.8 } }]
      events: [{ atSec: 15, event: { kind: traffic, action: ramp, params: { x: 3 }, durationSec: 20 } }]
    pass:
      - { metric: p99, op: '<', value: 100 }
      - { metric: availability, op: '>=', value: 99.9 }
  - id: dense-city
    title: "Dense downtown: hot geo cell"
    template: problem-yelp-v2
    scenario:
      durationSec: 60
      sources: [{ id: searches, node: users, shape: { kind: constant, rps: 6000 }, readRatio: 0.97, keys: { kind: zipf, s: 0.8 } }]
      events: [{ atSec: 20, event: { kind: hot-cell, target: geo, params: { hot: 30, x: 10 }, durationSec: 40 } }]
    pass:
      - { metric: p99, op: '<', value: 100 }
      - { metric: availability, op: '>=', value: 99.9 }
      - { metric: costMonth, op: '<=', value: 2000 }
keyIdeas:
  - { label: Geohash cells + neighbours, link: "lesson:proximity/geohash-buckets" }
  - { label: Quadtree adapts to density, link: "algo:quadtree" }
  - { label: Shard the geo index, link: "lesson:proximity/geo-sharding" }
  - { label: Async write path for reviews, link: "lesson:message-queue/queue-vs-stream" }
