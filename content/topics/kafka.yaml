id: kafka
title: Kafka
group: under-the-hood
icon: scroll-text
order: 1
summary: A replicated, partitioned log — how a record gets from producer to consumer, and every place it can be lost or read twice.
info: A topic is split into partitions; each partition is a log with one leader broker and followers that copy it. The in-sync replicas (ISR) decide when a record is committed (the high watermark). A KRaft controller quorum elects leaders; consumer groups split partitions between members and commit offsets.
problems: [distributed-mq]
algos: [kafka-storage, kafka-replication, kafka-eos, kafka-groups, stk-kafka-ops, stk-kafka-sizing]
lessons:
  - id: anatomy
    title: Anatomy of a Kafka cluster
    minutes: 4
    template: tech-kafka-anatomy
    steps:
      - title: The parts
        body: A producer, three brokers, a KRaft controller and a consumer group of two. The topic has 6 partitions, each copied to all 3 brokers.
        watch: Produce and Fetch messages (violet) flow producer → brokers → consumers.
        check: { metric: time, op: '>=', value: 3 }
      - title: Every partition has one leader
        body: Leadership is spread so each broker leads 2 partitions and follows 4. The 👑 badge lists what a broker leads.
        watch: broker-1 shows 👑 P0 P3.
        check: { metric: badge:👑 P0, target: b1, op: '>=', value: 1 }
      - title: The controller owns metadata
        body: The active KRaft controller tracks brokers by heartbeat and decides who leads what.
        check: { metric: badge:👑 active, target: ctrl, op: '>=', value: 1 }
      - title: The group splits partitions
        body: broker-2 is the group coordinator for "billing"; it gave consumer-1 P0,P2,P4 and consumer-2 the rest.
        watch: consumer badges list their partitions; broker-2 shows "coord billing".
        check: { metric: badge:coord billing, target: b2, op: '>=', value: 1 }
      - title: Consumers keep up
        body: Lag is how far a consumer's position trails the high watermark. Near zero means they keep up.
        check: { metric: gauge:processed, target: c1, op: '>=', value: 2000 }

  - id: lifecycle
    title: "Lifecycle: one record, end to end"
    minutes: 4
    template: tech-kafka-anatomy
    steps:
      - title: Produce
        body: The producer hashes the key to a partition, waits up to linger.ms to fill a batch, then sends it to that partition's leader.
        check: { metric: rps, target: prod, op: '>=', value: 500 }
      - title: Leader appends
        body: The leader appends the batch to its log. With acks=all it holds the reply until the ISR has it.
        check: { metric: rps, target: b1, op: '>=', value: 100 }
      - title: Followers fetch
        body: Followers long-poll the leader with Fetch requests and append the same bytes. Caught-up followers stay in the ISR.
        watch: No ISR badge on any broker means every partition has all 3 replicas in sync.
        check: { metric: gauge:isrMin, target: b1, op: '>=', value: 3 }
      - title: High watermark
        body: Once every ISR member has an offset, the leader advances the high watermark and acks the producer. Consumers only see records below it.
        check: { metric: gauge:hw, target: b1, op: '>=', value: 2000 }
      - title: Consumer fetch and commit
        body: A consumer polls a batch up to the high watermark, processes it, then commits the next offset to the coordinator.
        check: { metric: gauge:processed, target: c2, op: '>=', value: 3000 }

  - id: batching
    title: "Why fast: batching"
    minutes: 3
    template: tech-kafka-batching
    steps:
      - title: Same load, two producers
        body: Both get 1,000 records/s. Producer A sends each record alone; producer B lingers 20ms and sends batches.
        check: { metric: time, op: '>=', value: 4 }
      - title: A floods the brokers
        body: One request per record — every one pays a network round trip and a request-handler slot.
        check: { metric: gauge:batchesPerSec, target: pa, op: '>=', value: 400 }
      - title: B sends a few big batches
        body: About 10× fewer requests for the same records. Sequential appends of big batches are what disks and networks do best.
        check: { metric: gauge:batchAvg, target: pb, op: '>=', value: 5 }
      - title: The price is latency
        body: B's records wait up to 20ms for their batch. linger.ms trades a little latency for throughput.
        check: { metric: p99, target: pb, op: '>', value: 15 }

  - id: acks
    title: "acks=1 vs acks=all"
    minutes: 4
    template: tech-kafka-acks
    steps:
      - title: acks=1 is faster
        body: The acks=1 producer is answered as soon as the leader has written; acks=all also waits for followers.
        check: { metric: p99, target: pall, op: '>', value: 3 }
      - title: Slow down broker-2
        body: Make broker-2 fetch only every 1.5s. It is still inside replica.lag.time.max (2s), so it stays in the ISR — but behind.
        action: { event: { kind: replica-lag, target: b2, params: { ms: 1500 } } }
        check: { metric: eventCount:chaos, op: '>=', value: 1 }
      - title: And broker-3
        body: Now both followers of P0 trail the leader by up to 1.5s.
        action: { event: { kind: replica-lag, target: b3, params: { ms: 1500 } } }
        check: { metric: eventCount:chaos, op: '>=', value: 2 }
      - title: Kill the leader
        body: Kill broker-1. The controller elects an in-sync follower — which never got the last records.
        action: { event: { kind: kill, target: b1 } }
        check: { metric: eventMatch:Elected leader P0, op: '>=', value: 1 }
      - title: Acknowledged records are gone
        body: acks=1 records the leader had acked but nobody had copied are lost. acks=all records were only acked once in every ISR member, so they survive.
        check: { metric: anomaly:lost-write, op: '>=', value: 1 }

  - id: failover
    title: "Break it: leader dies — clean vs unclean election"
    minutes: 5
    template: tech-kafka-failover
    steps:
      - title: Kill a leader
        body: Kill broker-1. It stops heartbeating; after 1.5s the controller fences it and picks a new leader from each partition's ISR.
        action: { event: { kind: kill-leader, target: b1 } }
        check: { metric: eventMatch:Elected leader P3, op: '>=', value: 1 }
      - title: Clean election loses nothing
        body: The new leader was in sync, so every acknowledged record is there. Producers retry and carry on.
        check: { metric: availability, op: '>=', value: 99 }
      - title: Bring broker-1 back
        body: It truncates to the new leader's log, catches up, rejoins the ISR, and later takes back its preferred partitions.
        action: { event: { kind: heal-all } }
        check: { metric: eventMatch:preferred leader, op: '>=', value: 1 }
      - title: Starve the followers
        body: Slow both followers of P0 and P3 to one fetch every 8s. After 2s they fall out of the ISR; min.insync.replicas=1 lets the leader keep acking alone.
        action: { event: { kind: replica-lag, target: b2, params: { ms: 8000 } } }
        check: { metric: eventMatch:shrank, op: '>=', value: 1 }
      - title: Slow broker-3 too
        body: Now broker-1 is the only in-sync replica of P0.
        action: { event: { kind: replica-lag, target: b3, params: { ms: 8000 } } }
        check: { metric: "eventMatch:P0 shrank → {broker-1}", op: '>=', value: 1 }
      - title: Kill the lonely leader
        body: No in-sync replica is left. unclean.leader.election=true lets an out-of-sync follower lead — the partition stays writable, but acked records are gone.
        action: { event: { kind: kill, target: b1 } }
        check: { metric: eventMatch:UNCLEAN, op: '>=', value: 1 }
      - title: Count the loss
        body: With unclean election off the partition would stay offline instead. Availability or durability — pick one.
        check: { metric: anomaly:lost-write, op: '>=', value: 1 }

  - id: isr
    title: "Break it: slow follower, min.insync.replicas"
    minutes: 4
    template: tech-kafka-isr
    steps:
      - title: A follower's disk gets slow
        body: broker-3 now fetches only every 5s. acks=all writes wait on it until the leader gives up after 2s.
        action: { event: { kind: replica-lag, target: b3, params: { ms: 5000 } } }
        check: { metric: eventMatch:shrank, op: '>=', value: 2 }
      - title: The ISR shrinks, writes resume
        body: broker-3 is dropped from the ISR. 2 replicas ≥ min.insync.replicas 2, so acks=all works again.
        check: { metric: availability, op: '>=', value: 99 }
      - title: Lose another replica
        body: Kill broker-2. Every partition is now down to one in-sync replica.
        action: { event: { kind: kill, target: b2 } }
        check: { metric: eventMatch:NOT_ENOUGH_REPLICAS, op: '>=', value: 1 }
      - title: acks=all refuses to lie
        body: With ISR 1 < min.insync.replicas 2 the brokers reject acks=all writes rather than accept data they could lose.
        check: { metric: availability, op: '<', value: 50 }

  - id: rebalance-storm
    title: "Break it: slow consumer → rebalance storm"
    minutes: 4
    template: tech-kafka-rebalance
    steps:
      - title: Make consumer-2 10× slower
        body: A batch of 500 records now takes longer than max.poll.interval.ms (3s here, 5 min by default).
        action: { event: { kind: slow, target: c2, params: { x: 10 } } }
        check: { metric: eventMatch:max.poll.interval, op: '>=', value: 1 }
      - title: It leaves, the group stops
        body: Leaving triggers a rebalance; with the eager protocol every member stops consuming until assignment is done.
        check: { metric: gauge:rebalances, target: c1, op: '>=', value: 3 }
      - title: Its commit bounces
        body: When consumer-2 finally finishes, its generation is stale, so the commit fails and those records are read again.
        check: { metric: anomaly:duplicate, op: '>=', value: 1 }
      - title: Round and round
        body: It rejoins, gets partitions, is too slow again, leaves again. Fix it with fewer records per poll or faster processing.
        check: { metric: gauge:rebalances, target: c1, op: '>=', value: 5 }

  - id: hot-partition
    title: "Break it: hot key → hot partition"
    minutes: 3
    template: tech-kafka-hot-partition
    steps:
      - title: Even spread
        body: 3,000 records/s hashed over 6 partitions; both consumers are nearly idle.
        check: { metric: time, op: '>=', value: 4 }
      - title: One key goes viral
        body: 60% of records now carry the same key, so they all hash to P0.
        action: { event: { kind: traffic, action: hot-key, params: { hot: 0.6 }, durationSec: 60 } }
        check: { metric: eventCount:traffic, op: '>=', value: 1 }
      - title: One consumer drowns
        body: P0 has one leader and one consumer. consumer-1 falls behind while consumer-2 idles — more consumers won't help.
        check: { metric: gauge:lag, target: c1, op: '>=', value: 1000 }

  - id: commit
    title: "Break it: commit before vs after processing"
    minutes: 4
    template: tech-kafka-commit
    steps:
      - title: Two groups, one topic
        body: Group "before" commits the batch's offsets, then processes. Group "after" processes, then commits. Both are busy, so a crash lands mid-batch.
        check: { metric: time, op: '>=', value: 5 }
      - title: Crash a "before" consumer
        body: Kill before-2 mid-batch. Its offsets were already committed, so whoever takes over starts after the batch.
        action: { event: { kind: kill, target: cb2 } }
        check: { metric: anomaly:lost-write, op: '>=', value: 1 }
      - title: Crash an "after" consumer
        body: Kill after-2. Records it processed since its last commit get read again by the new owner.
        action: { event: { kind: kill, target: ca2 } }
        check: { metric: anomaly:duplicate, op: '>=', value: 1 }
      - title: Pick your failure
        body: Commit-before = at-most-once (loss); commit-after = at-least-once (duplicates). Make processing idempotent and commit after.
        check: { metric: eventMatch:session expired, op: '>=', value: 2 }

  - id: controller
    title: "Break it: controller loss"
    minutes: 4
    template: tech-kafka-controller
    steps:
      - title: Kill the active controller
        body: Three controllers form a Raft quorum. Kill controller-1 and a survivor takes over.
        action: { event: { kind: kill, target: ctrl1 } }
        check: { metric: eventMatch:elected active controller, op: '>=', value: 1 }
      - title: Kill another one
        body: One of three alive is not a majority. No controller can be elected.
        action: { event: { kind: kill, target: ctrl2 } }
        check: { metric: eventMatch:No controller quorum, op: '>=', value: 1 }
      - title: Nothing seems wrong
        body: Brokers keep serving produce and fetch — the data plane doesn't need the controller.
        check: { metric: availability, op: '>=', value: 99 }
      - title: Now a broker dies
        body: Kill broker-2. Nobody fences it, nobody elects new leaders, and the ISR can't shrink.
        action: { event: { kind: kill, target: b2 } }
        check: { metric: eventMatch:no active controller, op: '>=', value: 1 }
      - title: Writes stall everywhere
        body: acks=all waits on a dead replica in every ISR. Metadata is frozen until the quorum returns.
        check: { metric: availability, op: '<', value: 50 }

  - id: log-segments
    title: "Inside: log segments and the sparse index"
    minutes: 3
    algo: kafka-storage
    steps:
      - title: A directory of segments
        body: Each partition is a folder of .log files named after their first offset. Only the newest, active segment takes appends.
        input: segments
        check: { metric: manual }
      - title: Sparse index
        body: The .index holds one entry per ~4 KiB of log, so it stays small enough to mmap. A lookup is a binary search plus a short scan.
        watch: Tap the index entry for its format.
        check: { metric: manual }
      - title: Retention drops whole files
        body: Time and size retention delete closed segments, never single records. The .timeindex serves offsetsForTimes the same way.
        check: { metric: manual }

  - id: zero-copy
    title: "Inside: page cache and zero-copy"
    minutes: 3
    algo: kafka-storage
    steps:
      - title: Write to RAM, not disk
        body: Brokers write into the OS page cache and leave flushing to the kernel. Replication, not fsync, makes a record durable.
        input: zerocopy
        check: { metric: manual }
      - title: sendfile
        body: Fetches call transferTo, so the kernel sends cached pages straight to the socket. Bytes never enter the JVM heap.
        check: { metric: manual }
      - title: Laggards hurt everyone
        body: A consumer reading old data pulls cold segments from disk and can evict pages the tail readers need.
        check: { metric: manual }

  - id: compaction
    title: "Inside: log compaction"
    minutes: 3
    algo: kafka-storage
    steps:
      - title: Latest value per key
        body: cleanup.policy=compact keeps at least the last record for every key. New writes collect in a dirty section.
        input: compaction
        check: { metric: manual }
      - title: The cleaner
        body: When dirty bytes pass min.cleanable.dirty.ratio, the cleaner maps keys to their latest offset and recopies segments without the older records.
        check: { metric: manual }
      - title: Gaps and tombstones
        body: Offsets never change, so the log gets gaps. A null value deletes a key and is itself removed after delete.retention.ms.
        check: { metric: manual }

  - id: high-watermark
    title: "Inside: the high watermark"
    minutes: 3
    algo: kafka-replication
    steps:
      - title: Log end offsets
        body: Every replica has a log end offset (LEO). Followers report theirs in each Fetch request.
        input: hw
        check: { metric: manual }
      - title: Minimum across the ISR
        body: The high watermark is the smallest LEO in the ISR. Only records below it are committed and readable.
        check: { metric: manual }
      - title: Shrinking the ISR unblocks it
        body: A follower that stops fetching is dropped after replica.lag.time.max.ms, and the HW moves on without it.
        check: { metric: manual }

  - id: leader-epoch
    title: "Inside: leader epochs and truncation"
    minutes: 3
    algo: kafka-replication
    steps:
      - title: An uncommitted tail
        body: The old leader wrote a record no follower copied. After failover the new leader writes a different record at the same offset.
        input: epoch
        check: { metric: manual }
      - title: Ask where the epoch ended
        body: The returning replica sends OffsetsForLeaderEpoch and truncates exactly where its history diverged.
        watch: Offset 4 ends up as y on both brokers.
        check: { metric: manual }

  - id: kraft-quorum
    title: "Inside: the KRaft metadata log"
    minutes: 3
    algo: kafka-replication
    steps:
      - title: Metadata is a log
        body: Controllers run Raft on __cluster_metadata. Every topic, partition and broker change is a record committed by a majority.
        input: kraft
        check: { metric: manual }
      - title: Brokers are observers
        body: Brokers replicate the same log and apply only new records to their metadata cache.
        check: { metric: manual }
      - title: Instant failover
        body: A standby controller already holds the whole log, so it takes over in a new Raft epoch without reloading state.
        check: { metric: manual }

  - id: idempotence
    title: "Inside: the idempotent producer"
    minutes: 3
    algo: kafka-eos
    steps:
      - title: PID and sequence numbers
        body: Each batch carries a producer ID and a per-partition sequence number.
        input: idempotent
        check: { metric: manual }
      - title: Retries are deduplicated
        body: A retried batch the leader already has is acknowledged without a second append.
        check: { metric: manual }
      - title: No reordering
        body: A sequence gap is rejected, so up to 5 in-flight requests keep their order.
        check: { metric: manual }

  - id: transactions
    title: "Inside: transactions and read_committed"
    minutes: 5
    algo: kafka-eos
    steps:
      - title: Coordinator and fencing
        body: initTransactions bumps the epoch for a transactional.id, fencing any zombie instance. The coordinator logs every partition the transaction touches.
        input: txn
        check: { metric: manual }
      - title: Output and offsets together
        body: sendOffsetsToTransaction puts consumed offsets in the same transaction, so read-process-write is atomic.
        check: { metric: manual }
      - title: Commit markers
        body: PrepareCommit is the commit point. The coordinator then writes a COMMIT marker into each partition.
        check: { metric: manual }
      - title: Last stable offset
        body: read_committed consumers stop at the first offset of the oldest open transaction and drop aborted records.
        input: lso
        check: { metric: manual }
      - title: Hung transactions
        body: An open transaction pins the LSO until it commits or transaction.timeout.ms aborts it.
        check: { metric: manual }

  - id: group-protocol
    title: "Inside: the consumer group protocol"
    minutes: 5
    algo: kafka-groups
    steps:
      - title: JoinGroup and SyncGroup
        body: The coordinator bumps the generation and picks a group leader, which computes the assignment on the client.
        input: join
        check: { metric: manual }
      - title: Generations fence zombies
        body: A commit from an old generation is rejected with ILLEGAL_GENERATION.
        check: { metric: manual }
      - title: Eager vs cooperative
        body: Eager rebalances revoke everything first. Cooperative-sticky moves only the partitions that change owner.
        input: cooperative
        check: { metric: manual }
      - title: Static membership
        body: With group.instance.id a restart within session.timeout.ms gets its old partitions back without a rebalance.
        input: static
        check: { metric: manual }

  - id: ops-bootstrap
    title: "Ops: bootstrap a KRaft cluster"
    minutes: 4
    algo: stk-kafka-ops
    steps:
      - title: "One config, three nodes"
        body: "Every node is broker and controller, with its own node.id and the same static controller.quorum.voters list."
        watch: "Tap server.properties to see the exact lines from kafka-flow."
        input: format
        check: { metric: manual }
      - title: "Format once"
        body: "kafka-storage.sh format stamps log.dirs with a shared cluster ID. Nodes with different IDs refuse to talk."
        check: { metric: manual }
      - title: "The quorum elects itself"
        body: "Controllers vote over port 9093; the winner owns all metadata and the others fetch its metadata log."
        check: { metric: manual }

  - id: ops-topic
    title: "Ops: create a replicated topic"
    minutes: 3
    algo: stk-kafka-ops
    steps:
      - title: "Any broker, one controller"
        body: "CreateTopics can go to any broker; it is forwarded to the active controller, the only metadata writer."
        input: topic
        check: { metric: manual }
      - title: "Read --describe"
        body: "Leader, Replicas and Isr per partition. Leaders are spread so each broker leads one partition."
        watch: "Isr shrinks when a follower dies or lags."
        check: { metric: manual }

  - id: ops-record-path
    title: "Ops: one record, every request"
    minutes: 4
    algo: stk-kafka-ops
    steps:
      - title: "Metadata first"
        body: "A producer asks any bootstrap broker where the leader of its partition lives, then talks to that leader directly."
        input: produce
        check: { metric: manual }
      - title: "acks=all waits for followers"
        body: "The leader appends, followers fetch the record, and only when the ISR has it does the producer get its ack."
        watch: "Two follower Fetch round trips happen before the ack."
        check: { metric: manual }
      - title: "Read and commit"
        body: "The consumer reads below the high watermark and commits its next offset to the group coordinator."
        check: { metric: manual }

  - id: ops-kill-leader
    title: "Ops: kill the partition leader"
    minutes: 4
    algo: stk-kafka-ops
    steps:
      - title: "The experiment"
        body: "kill -9 the broker leading P1, then describe the topic again."
        input: failover
        check: { metric: manual }
      - title: "New leader from the ISR"
        body: "The controller fences the dead broker and promotes an in-sync follower, bumping the leader epoch."
        check: { metric: manual }
      - title: "Clients recover"
        body: "The producer’s request times out, it refreshes metadata and retries on the new leader. No acked record is lost."
        check: { metric: manual }

  - id: sizing-rf
    title: "Sizing: replication factor"
    minutes: 3
    algo: stk-kafka-sizing
    steps:
      - title: "RF 1 vs RF 3"
        body: "The single-node helloworld runs RF 1: learning only. The 3-node cluster runs RF 3."
        input: rf
        check: { metric: manual }
      - title: "The usual setting"
        body: "RF 3, min.insync.replicas=2 and acks=all survive one broker without losing acked data or blocking writes."
        check: { metric: manual }

  - id: sizing-partitions
    title: "Sizing: partition count"
    minutes: 3
    algo: stk-kafka-sizing
    steps:
      - title: "Unit of parallelism"
        body: "One consumer per partition per group; extra consumers idle."
        input: partitions
        check: { metric: manual }
      - title: "Choose up front"
        body: "Adding partitions later remaps keys and breaks per-key ordering."
        check: { metric: manual }

  - id: sizing-memory
    title: "Sizing: heap vs page cache"
    minutes: 3
    algo: stk-kafka-sizing
    steps:
      - title: "Small heap on purpose"
        body: "On a 2 GB t2.small, KAFKA_HEAP_OPTS pins the heap to 512 MB and leaves the rest to the page cache."
        input: memory
        check: { metric: manual }
      - title: "Tail reads are memory reads"
        body: "Consumers that keep up read from cache; a replay from the beginning hits disk and evicts hot pages."
        check: { metric: manual }

  - id: sizing-tiered
    title: "Hot and cold tiers"
    minutes: 3
    algo: stk-kafka-sizing
    steps:
      - title: "Local disk is the hot tier"
        body: "Recent segments stay local; closed segments are copied to object storage."
        input: tiered
        check: { metric: manual }
      - title: "Cheap retention"
        body: "Long retention costs object storage, not broker disk, and replacement brokers copy far less."
        check: { metric: manual }
