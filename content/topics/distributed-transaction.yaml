id: distributed-transaction
title: Distributed transaction
group: topics
icon: arrow-left-right
order: 5
summary: Keep several services or databases consistent when one business action touches all of them.
info: One database gives you a transaction for free; several don't. Two-phase commit makes them all-or-nothing but blocks when the coordinator dies. Sagas and outboxes give up atomicity for availability and repair failures with compensations, retries and idempotency.
algos: [raft-log, clocks, sd-txn-seq]
problems: [ticket-booking, distributed-mq]
lessons:
  - id: 2pc-happy-path
    title: 2PC happy path
    minutes: 3
    template: lesson-txn-2pc
    steps:
      - title: Prepare, then commit
        body: For each checkout the coordinator asks all 3 databases to prepare (lock rows, vote yes). Only when all vote yes does it send commit.
        watch: Open the sequence view to see txn.prepare, the votes, then txn.commit.
        check: { metric: gauge:committed, target: tm, op: '>=', value: 50 }
      - title: One participant says no
        body: Tap ⚡ Break → Disk full on Stock DB. It can't prepare, so it votes no.
        action: { event: { kind: disk-full, target: stock, durationSec: 15 } }
        watch: The coordinator sends abort to everyone; nothing commits anywhere.
        check: { metric: gauge:aborted, target: tm, op: '>=', value: 20 }
      - title: All or nothing
        body: Aborted checkouts left no half-written order or payment. After 15s the disk frees up and commits resume.
        check: { metric: chaosActive, op: '=', value: 0 }

  - id: 2pc-blocking
    title: 2PC blocking
    minutes: 4
    template: lesson-txn-2pc-blocking
    steps:
      - title: Normal 2PC
        body: Same checkout as before, committing across 3 databases.
        check: { metric: time, op: '>=', value: 3 }
      - title: Crash after prepare
        body: Tap ⚡ Break → Kill coordinator. It dies right after every database voted yes, before sending the decision.
        action: { event: { kind: kill-coordinator, target: tm, durationSec: 15 } }
        watch: Each database holds the locked rows (lockedKeys) and can't commit or abort on its own.
        check: { metric: gauge:lockedKeys, target: orders, op: '>=', value: 1 }
      - title: Blocked
        body: Any checkout touching those rows would wait. The alert fires after 3s of held locks.
        check: { metric: alerts, op: '>=', value: 1 }
      - title: Recovery from the log
        body: After 15s the coordinator restarts and reads its decision log. The transaction has no commit record, so it is presumed aborted.
        check: { metric: eventMatch:presumed abort, op: '>=', value: 1 }
      - title: Locks released
        body: Participants get the abort and free the rows. 2PC is safe, but a dead coordinator stalls everyone who touched its rows.
        check: { metric: gauge:lockedKeys, target: orders, op: '=', value: 0 }

  - id: saga-orchestrated
    title: Saga (orchestrated)
    minutes: 4
    template: lesson-txn-saga-orch
    steps:
      - title: A chain of local transactions
        body: The orchestrator creates the order, charges payment, then reserves inventory. Each step commits on its own; no locks span services.
        check: { metric: gauge:committed, target: orch, op: '>=', value: 50 }
      - title: Payment fails
        body: Tap ⚡ Break → Disk full on Payment. The charge step fails after the order was already created.
        action: { event: { kind: disk-full, target: payment, durationSec: 15 } }
        watch: The orchestrator runs the compensation for each done step in reverse (cancel order). Open the sequence view.
        check: { metric: gauge:compensations, target: orch, op: '>=', value: 20 }
      - title: Consistent in the end
        body: Between the order and its cancel, other readers could see an order that later vanished. Sagas trade isolation for availability.
        watch: When Payment recovers after 15s, sagas complete again.
        check: { metric: chaosActive, op: '=', value: 0 }

  - id: saga-choreographed
    title: Saga (choreographed)
    minutes: 4
    template: lesson-txn-saga-choreo
    steps:
      - title: Services react to events
        body: Order publishes order.created; Payment consumes it and publishes payment.done, which Inventory consumes. Nobody holds the whole flow.
        check: { metric: rps, target: inventory, op: '>=', value: 20 }
      - title: Follow one checkout
        body: Open a trace. The client's reply comes back once Order publishes; payment and inventory happen later as separate async hops.
        check: { metric: time, op: '>=', value: 5 }
      - title: Payment goes down
        body: Tap ⚡ Break → Kill on Payment for 10s. Checkout still returns OK, but order.created events pile up.
        action: { event: { kind: kill, target: payment, durationSec: 10 } }
        watch: Availability stays 100% while sagas are stuck; only the backlog on order.created tells you.
        check: { metric: gauge:backlog, target: bus-a, op: '>=', value: 50 }
      - title: The backlog drains
        body: Payment returns and works through the backlog. With choreography, "where is order 42?" means reading every service's logs.
        check: { metric: gauge:backlog, target: bus-a, op: '<=', value: 10 }

  - id: transactional-outbox
    title: Transactional outbox
    minutes: 4
    template: lesson-txn-outbox
    steps:
      - title: Two ways to publish
        body: Left commits the order, then publishes to Kafka. Right writes the order and an outbox row in one DB transaction; Debezium relays outbox rows to Kafka.
        check: { metric: time, op: '>=', value: 3 }
      - title: Kafka goes down
        body: Tap ⚡ Break → Kill on the orders topic for 10s.
        action: { event: { kind: kill, target: k, durationSec: 10 } }
        watch: The dual write commits orders whose events never get published. The lost-write counter climbs.
        check: { metric: anomaly:lost-write, op: '>=', value: 20 }
      - title: The outbox holds them
        body: The outbox rows committed with the orders, so nothing is lost; they wait in the table.
        check: { metric: gauge:pending, target: ob, op: '>=', value: 50 }
      - title: Relay catches up
        body: When Kafka returns, Debezium publishes the backlog. Some may be sent twice, so consumers dedupe by event id.
        check: { metric: gauge:pending, target: ob, op: '<=', value: 20 }

  - id: idempotency-keys
    title: Idempotency keys
    minutes: 3
    template: lesson-txn-idempotency
    steps:
      - title: Timeouts cause retries
        body: The Orders API waits 200ms for payment, then retries. A slow charge that already went through gets sent again.
        watch: The legacy API charges the card twice; the duplicate counter climbs.
        check: { metric: anomaly:duplicate, op: '>=', value: 5 }
      - title: Idempotency keys dedupe
        body: Stripe stores each request's key and result. A retry with the same key gets the stored result instead of a second charge.
        watch: Stripe's deduped gauge climbs; its duplicates stay at 0.
        check: { metric: gauge:deduped, target: stripe, op: '>=', value: 5 }
      - title: Slow payments, more duplicates
        body: Tap ⚡ Break → Slow on Legacy payments. More charges run past the timeout, so more get retried and charged again.
        action: { event: { kind: slow, target: legacy, params: { x: 4 }, durationSec: 30 } }
        check: { metric: anomaly:duplicate, op: '>=', value: 50 }

  - id: message-by-message
    title: Every message, step by step
    minutes: 6
    algo: sd-txn-seq
    steps:
      - title: 2PC commit
        body: PREPARE to each participant, YES votes back, the decision logged, COMMIT out, ACKs back. Tap Next to see each request and response.
        input: 2pc
        check: { metric: manual }
      - title: 2PC abort
        body: One NO vote aborts everyone. A coordinator crash between prepare and decision leaves participants blocked holding locks.
        input: 2pc-abort
        check: { metric: manual }
      - title: Orchestrated saga
        body: Each step commits locally right away. The order is visibly PENDING until the last step confirms it.
        input: saga
        check: { metric: manual }
      - title: Compensation
        body: A late failure runs the completed steps' undo actions in reverse. Compensations only run in failures, so test them hardest.
        input: saga-fail
        check: { metric: manual }
      - title: Choreography
        body: No orchestrator; services react to each other's events. Easy to add a listener, hard to see the whole flow in one place.
        input: choreo
        check: { metric: manual }
      - title: Outbox
        body: The event row commits in the same local transaction as the order, then a relay publishes it. Consumers still dedupe.
        input: outbox
        check: { metric: manual }
      - title: Default
        body: Sagas plus outbox across services; 2PC only inside one failure domain where blocking is acceptable.
        check: { metric: manual }
