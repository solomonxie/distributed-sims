id: machine-cpp
title: C++
group: machine
icon: braces
order: 8
summary: How C++ maps onto the machine, from object layout, lifetime and atomics to CMake, libraries, ABI and structuring large projects.
info: C++ gives you the machine with abstractions that compile away. Knowing what each feature costs in bytes, loads and branches is the whole skill. Objects have a layout you can draw, lifetimes tied to scopes, and a memory model that sits directly on the cache coherence of the CPU. Undefined behaviour is a contract with the optimiser, not a hardware accident. Real projects add a second layer, a CMake target graph, third-party dependencies, static and shared libraries with an ABI to keep, and build times that grow with every header.
algos: [cpp-build, cpp-layout, cpp-memory, cpp-raii, cpp-move, cpp-codegen, cpp-vector, cpp-vtable, cpp-atomics, cmake-pipeline, cmake-targets, cmake-deps, cmake-config, cpp-architecture, cpp-rebuild, cpp-libs, cpp-abi]
lessons:
  - id: build
    title: Compile & link
    minutes: 4
    algo: cpp-build
    steps:
      - title: Translation units
        body: "#include pastes headers in. Each .cpp then compiles alone into an object file."
        input: ok
        check: { metric: manual }
      - title: Symbols
        body: square(int) is mangled to _Z6squarei. Objects list what they define (T) and what they need (U).
        watch: The linker draws the U → T match.
        check: { metric: manual }
      - title: Undefined reference
        body: Compiles fine, fails to link. A declaration without a definition anywhere in the build.
        input: undefined
        check: { metric: manual }
      - title: Multiple definition
        body: A function body in a header, included twice. Mark it inline or move it to one .cpp.
        input: duplicate
        check: { metric: manual }

  - id: layout
    title: Types, sizeof & padding
    minutes: 4
    algo: cpp-layout
    steps:
      - title: Alignment
        body: An int sits at a multiple of 4, a double at a multiple of 8. The compiler pads to get there.
        watch: 14 bytes of data, sizeof 24.
        input: bad
        check: { metric: manual }
      - title: Order fields largest first
        body: Same fields, 16 bytes. A third less memory for every array of them.
        input: good
        check: { metric: manual }
      - title: The hidden vptr
        body: Any virtual function adds an 8-byte pointer to every object.
        input: virtual
        check: { metric: manual }
      - title: Why it matters
        body: Smaller structs mean more per 64-byte cache line. Fields written by different threads want separate lines (CPU → MESI).
        check: { metric: manual }

  - id: pointers
    title: Pointers & references
    minutes: 3
    algo: cpp-memory
    steps:
      - title: A pointer is an address
        body: "p = &x stores x's address. *p = 7 writes through it."
        watch: The arrow is the address; x changes without being named.
        input: pointers
        check: { metric: manual }
      - title: References
        body: Another name for an existing object. Can't be null, can't be re-pointed. Usually compiled as a pointer.
        check: { metric: manual }
      - title: In assembly
        body: "*p is just [rdi]. See Assembly → Memory addressing."
        check: { metric: manual }

  - id: stack-heap
    title: Stack, heap & lifetime
    minutes: 5
    algo: cpp-memory
    steps:
      - title: Stack lifetime
        body: Locals live in the frame and die at the closing brace. Allocation is one rsp subtract.
        input: heap
        check: { metric: manual }
      - title: Heap lifetime
        body: new outlives the function; it lives until delete. Forget delete and it leaks.
        watch: The heap block survives make()'s frame, then leaks at the end.
        check: { metric: manual }
      - title: Dangling pointers
        body: Returning &local points into a popped frame. The next call overwrites it.
        watch: "*p reads 1234, garbage from other()."
        input: dangling
        check: { metric: manual }

  - id: raii
    title: RAII & destructors
    minutes: 4
    algo: cpp-raii
    steps:
      - title: Manual cleanup leaks
        body: An exception skips the delete and fclose lines. 16 B and a file handle are gone.
        input: raw
        check: { metric: manual }
      - title: Owned by the stack
        body: vector and ofstream release in their destructors, which run during unwinding.
        watch: Destructors run in reverse order of construction.
        input: raii
        check: { metric: manual }
      - title: unique_ptr
        body: The same idea for any heap object. Zero overhead over a raw pointer, and no delete to forget.
        check: { metric: manual }

  - id: move
    title: Copy vs move
    minutes: 4
    algo: cpp-move
    steps:
      - title: Copy is deep
        body: Copying a vector allocates a new block and copies every element.
        input: copy
        check: { metric: manual }
      - title: Move steals
        body: std::move lets b take a's pointer. a is left valid but empty. No allocation.
        input: move
        check: { metric: manual }
      - title: Return by value
        body: The result is built straight in the caller's slot. Return big objects by value.
        input: ret
        check: { metric: manual }

  - id: templates
    title: Templates & zero-cost abstractions
    minutes: 4
    algo: cpp-codegen
    steps:
      - title: One copy per type
        body: twice<int> becomes lea, twice<double> becomes addsd. No runtime type checks.
        input: template
        check: { metric: manual }
      - title: Iterators compile away
        body: A range-for over a vector is the same 4-instruction pointer loop as hand-written C.
        watch: Compare with Assembly → Reading compiler output, -O2.
        input: rangefor
        check: { metric: manual }
      - title: The cost
        body: Every instantiation is more code. Compile time and binary size grow, not run time.
        check: { metric: manual }

  - id: vector
    title: vector & cache-friendly containers
    minutes: 5
    algo: cpp-vector
    steps:
      - title: Growth by doubling
        body: A full vector allocates 2× and moves everything over. Amortised O(1) push_back.
        watch: 5 allocations and 15 moves for 9 elements.
        input: grow
        check: { metric: manual }
      - title: Iterator invalidation
        body: A reallocation frees the old block. Iterators, pointers and references into it dangle.
        check: { metric: manual }
      - title: reserve
        body: One allocation, no moves, iterators stay valid.
        input: reserve
        check: { metric: manual }
      - title: vector vs list
        body: Contiguous ints share cache lines; list nodes are scattered and each hop is a miss.
        watch: 1 miss vs 9 for the same loop.
        input: list
        check: { metric: manual }

  - id: virtual
    title: Virtual dispatch & vtables
    minutes: 4
    algo: cpp-vtable
    steps:
      - title: vptr → vtable → function
        body: s->area() loads the vptr, loads slot 2, jumps there.
        input: circle
        check: { metric: manual }
      - title: Same call, other type
        body: A Square's vptr leads to Square's table. One call site, many targets.
        input: square
        check: { metric: manual }
      - title: Devirtualisation
        body: If the exact type is known (final), the call is direct and inlined. No loads, no indirect branch.
        input: direct
        check: { metric: manual }

  - id: atomics
    title: Threads, atomics & the memory model
    minutes: 5
    algo: cpp-atomics
    steps:
      - title: counter++ is three instructions
        body: Two threads load the same 0, both store 1. An update is lost.
        watch: The MESI states flip as each core writes.
        input: race
        check: { metric: manual }
      - title: std::atomic
        body: fetch_add is one lock xadd. The core owns the line in M state for the whole read-modify-write.
        watch: Correct, but the line bounces between cores (CPU → MESI).
        input: atomic
        check: { metric: manual }
      - title: Release / acquire
        body: A release store publishes every earlier write. An acquire load that sees it sees them too.
        input: publish
        check: { metric: manual }
      - title: Defaults
        body: Plain atomics are seq_cst, the safest ordering. Reach for mutex first; atomics are for small, hot state.
        check: { metric: manual }

  - id: ub
    title: Undefined behaviour
    minutes: 4
    algo: cpp-codegen
    steps:
      - title: Signed overflow
        body: The compiler assumes x + 1 never overflows, so x + 1 > x folds to true.
        input: overflow
        check: { metric: manual }
      - title: Late null check
        body: "*p before if (!p) proves p isn't null, so the check is deleted."
        input: nullcheck
        check: { metric: manual }
      - title: Catch it
        body: Build tests with -fsanitize=address,undefined. They catch dangling pointers, overflow and races (thread) at run time.
        check: { metric: manual }

  - id: cmake-basics
    title: "CMake: configure, generate, build"
    minutes: 5
    algo: cmake-pipeline
    steps:
      - title: Targets, not commands
        body: CMakeLists.txt declares targets. CMake generates the real build system (Ninja, Make, Xcode) from them.
        input: basic
        check: { metric: manual }
      - title: Three phases
        body: Configure finds the compiler and fills CMakeCache.txt. Generate writes build.ninja. Build runs it.
        watch: The build tree lives in build/, never in the sources.
        check: { metric: manual }
      - title: Incremental builds
        body: Ninja rebuilds what's stale. A .cpp edit costs one compile; a header edit costs every file that includes it.
        watch: math.h edited, both objects recompile.
        input: incremental
        check: { metric: manual }
      - title: The cache sticks
        body: -D values persist in CMakeCache.txt. The compiler is fixed at first configure; use --fresh or a new build dir.
        input: cache
        check: { metric: manual }

  - id: cmake-targets
    title: Targets & usage requirements
    minutes: 6
    algo: cmake-targets
    steps:
      - title: PUBLIC and PRIVATE
        body: PRIVATE is for the target itself. PUBLIC is for itself and everyone who links it. INTERFACE is only for them.
        watch: app gets core's include dir through net, and never sees fmt.
        input: public
        check: { metric: manual }
      - title: Too private
        body: If net's headers include core's, net must link core PUBLIC, or every user of net fails to compile.
        input: private
        check: { metric: manual }
      - title: Header-only and static libs
        body: INTERFACE libraries carry requirements only. Private deps of a static library still reach the final link line.
        input: interface
        check: { metric: manual }
      - title: No directory-wide flags
        body: include_directories, add_definitions and CMAKE_CXX_FLAGS leak into every target and hide real dependencies.
        input: global
        check: { metric: manual }

  - id: cmake-deps
    title: Third-party dependencies
    minutes: 6
    algo: cmake-deps
    steps:
      - title: find_package
        body: Finds an installed package's config file and gives you an imported target like fmt::fmt. Always ask for a minimum version.
        input: find
        check: { metric: manual }
      - title: FetchContent
        body: Downloads and builds a dependency inside your build, pinned to a tag or hash. Best for small or header-only libraries.
        input: fetch
        check: { metric: manual }
      - title: Package managers
        body: vcpkg or Conan pin the whole dependency tree, build it once with one triplet, and serve it from a binary cache.
        watch: Your CMake stays plain find_package.
        input: manager
        check: { metric: manual }

  - id: cmake-config
    title: Build types & presets
    minutes: 5
    algo: cmake-config
    steps:
      - title: Debug vs Release
        body: Release defines NDEBUG, so asserts vanish. RelWithDebInfo is optimised with symbols, the usual choice to ship.
        input: types
        check: { metric: manual }
      - title: Generator expressions
        body: $<CONFIG:Debug> and friends set flags per config and compiler. if(CMAKE_BUILD_TYPE) breaks under Xcode and Visual Studio.
        input: genex
        check: { metric: manual }
      - title: CMakePresets.json
        body: Every setup (debug, asan, release) named once in git, used identically by laptops, IDEs and CI.
        input: presets
        check: { metric: manual }

  - id: ci
    title: CI, sanitizers & tooling
    minutes: 4
    algo: cmake-config
    steps:
      - title: A build matrix
        body: Several compilers times several sanitizers. Each catches bugs the others miss.
        watch: ASan and TSan are separate jobs; they can't share a binary.
        input: ci
        check: { metric: manual }
      - title: compile_commands.json
        body: CMAKE_EXPORT_COMPILE_COMMANDS feeds clangd, clang-tidy and include-what-you-use with the exact flags of every file.
        check: { metric: manual }
      - title: Warnings
        body: Turn on -Wall -Wextra per target, and -Werror in CI only, so new compilers don't break users' builds.
        check: { metric: manual }

  - id: install-export
    title: Shipping a library
    minutes: 4
    algo: cmake-deps
    steps:
      - title: Install with requirements
        body: install(TARGETS … EXPORT) plus install(EXPORT) produce a package others use with find_package.
        input: export
        check: { metric: manual }
      - title: Namespaced targets
        body: Consumers link calc::core, which carries its include dirs and dependencies, just like fmt::fmt.
        check: { metric: manual }
      - title: Relocatable
        body: Use GNUInstallDirs and relative paths so the package works from any prefix.
        check: { metric: manual }

  - id: architecture
    title: Structuring a large codebase
    minutes: 6
    algo: cpp-architecture
    steps:
      - title: A layered library graph
        body: core (logic, no I/O) at the bottom, services in the middle, app on top wiring them. Arrows only point down.
        input: layers
        check: { metric: manual }
      - title: Cycles
        body: One stray #include makes two libraries one. Break it by inversion; the lower one declares an interface, the upper implements it.
        watch: After the fix, a net change no longer rebuilds core.
        input: cycle
        check: { metric: manual }
      - title: Tests per library
        body: One test binary per library, with fakes at the interface seams. ctest runs them in parallel.
        input: tests
        check: { metric: manual }

  - id: build-times
    title: Build times at scale
    minutes: 6
    algo: cpp-rebuild
    steps:
      - title: Header fan-out
        body: A header included by every file makes every edit to it a full rebuild. Keep such headers small and stable.
        input: fanout
        check: { metric: manual }
      - title: Forward declarations
        body: class Engine; is enough for pointers and references. Include the full header only in the .cpp that needs it.
        watch: 20 rebuilds become 3.
        input: fwd
        check: { metric: manual }
      - title: Pimpl
        body: Private members behind a unique_ptr<Impl> in the .cpp. A compilation firewall and a stable ABI, for one allocation.
        input: pimpl
        check: { metric: manual }
      - title: Faster tools
        body: ccache for repeat builds, precompiled headers, unity builds, and C++20 modules as the long-term fix.
        input: cache
        check: { metric: manual }

  - id: libraries
    title: Static vs shared libraries
    minutes: 6
    algo: cpp-libs
    steps:
      - title: Static
        body: An archive of objects, copied into each executable at link time. No runtime deps, but every app must relink for a fix.
        input: static
        check: { metric: manual }
      - title: Shared
        body: Loaded by ld.so at startup and shared between processes. Upgradable in place, if its ABI stays compatible.
        input: shared
        check: { metric: manual }
      - title: Finding it at run time
        body: RUNPATH, LD_LIBRARY_PATH, then system dirs. Set INSTALL_RPATH to $ORIGIN/../lib.
        input: notfound
        check: { metric: manual }
      - title: Visibility
        body: Hide everything by default and export the public API with a macro. The export list is your ABI.
        input: visibility
        check: { metric: manual }

  - id: abi
    title: ABI & binary compatibility
    minutes: 6
    algo: cpp-abi
    steps:
      - title: Layouts are baked in
        body: Callers compile in sizeof and field offsets. Changing an exposed struct breaks every binary built against the old one.
        input: layout
        check: { metric: manual }
      - title: Vtable slots
        body: Callers compile in slot numbers. Inserting a virtual shifts the rest; append only.
        input: vtable
        check: { metric: manual }
      - title: "std:: types at the boundary"
        body: The standard library's own ABI (string ABI flag, Debug runtime, libc++ vs libstdc++) must match on both sides.
        input: stdlib
        check: { metric: manual }
      - title: ODR violations
        body: Two versions of one header-only library in one program link silently and corrupt memory. One version per build graph.
        input: odr
        check: { metric: manual }
