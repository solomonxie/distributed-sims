id: os-shell
title: Shell, fds & make
group: machine
icon: square-terminal
order: 16
summary: What the shell does behind a pipeline, why 2>&1 order matters, exit codes and pipefail, and how make decides what to rebuild.
info: The shell is a small program that forks, wires file descriptors with pipe and dup2, and execs. Once you see pipelines and redirections as fd plumbing, their gotchas stop being surprising. make is the same kind of simple idea, a dependency graph compared by timestamps.
algos: [os-shell]
lessons:
  - id: pipes
    title: Pipelines & file descriptors
    minutes: 4
    algo: os-shell
    steps:
      - title: pipe, fork, dup2, exec
        body: One pipe per |, one child per command, each with fd 0 and fd 1 rewired before exec.
        input: pipe
        check: { metric: manual }
      - title: Streaming
        body: All commands run at once; a full pipe blocks the writer, an empty one blocks the reader.
        check: { metric: manual }
      - title: pipefail
        body: A pipeline's status is its last command's. Start scripts with set -euo pipefail.
        check: { metric: manual }
  - id: redirection
    title: Redirection order
    minutes: 3
    algo: os-shell
    steps:
      - title: 2>&1 copies, it doesn't link
        body: It makes fd 2 whatever fd 1 is at that moment, so > file 2>&1 and 2>&1 > file differ.
        input: redirect
        check: { metric: manual }
  - id: make
    title: make's dependency graph
    minutes: 4
    algo: os-shell
    steps:
      - title: Timestamps
        body: make rebuilds a target only if a prerequisite is newer.
        input: make
        check: { metric: manual }
      - title: Headers and -MMD
        body: List headers as prerequisites (or let gcc -MMD generate them) or stale objects slip through.
        check: { metric: manual }
      - title: .PHONY and -j
        body: Mark command targets .PHONY, and build independent targets in parallel with make -j.
        check: { metric: manual }
