id: patterns-dp
title: "Dynamic programming"
group: patterns
icon: table
order: 12
summary: "Define a state, write the recurrence, fill a table in dependency order."
info: "DP applies when a problem splits into overlapping subproblems with optimal substructure. Write the state (what dp[i] or dp[i][j] means), the recurrence (how it depends on smaller states), the base cases and the iteration order. Then look for space savings: many tables only need the previous row."
algos: [lc-dp]
lessons:
  - id: climbing-stairs
    title: "LC 70 · Climbing Stairs"
    minutes: 4
    algo: lc-dp
    steps:
      - title: "The problem"
        body: "Ways to climb n stairs taking 1 or 2 steps."
        input: "stairs"
        check: { metric: manual }
      - title: "The pattern"
        body: "dp[i] = dp[i−1] + dp[i−2]: the last move was one step or two."
        watch: "Only the last two values are ever needed."
        check: { metric: manual }
      - title: "Cost"
        body: "O(n) time, O(1) space."
        check: { metric: manual }

  - id: house-robber
    title: "LC 198 · House Robber"
    minutes: 4
    algo: lc-dp
    steps:
      - title: "The problem"
        body: "Maximum loot without robbing two neighbours."
        input: "rob"
        check: { metric: manual }
      - title: "The pattern"
        body: "best[i] = max(skip: best[i−1], take: nums[i] + best[i−2])."
        watch: "Each house is a take-or-skip decision."
        check: { metric: manual }
      - title: "Cost"
        body: "O(n)."
        check: { metric: manual }

  - id: coin-change
    title: "LC 322 · Coin Change"
    minutes: 4
    algo: lc-dp
    steps:
      - title: "The problem"
        body: "Fewest coins to make an amount."
        input: "coins"
        check: { metric: manual }
      - title: "The pattern"
        body: "dp[a] = 1 + min over coins of dp[a − coin]; greedy fails on [1,3,4] for 6."
        watch: "Each amount tries every possible last coin."
        check: { metric: manual }
      - title: "Cost"
        body: "O(amount × coins)."
        check: { metric: manual }

  - id: lcs
    title: "LC 1143 · Longest Common Subsequence"
    minutes: 5
    algo: lc-dp
    steps:
      - title: "The problem"
        body: "Longest subsequence common to two strings."
        input: "lcs"
        check: { metric: manual }
      - title: "The pattern"
        body: "Match: diagonal + 1. No match: max of up and left."
        watch: "The table fills row by row."
        check: { metric: manual }
      - title: "Cost"
        body: "O(n × m) time; one row of space is enough."
        check: { metric: manual }

  - id: partition
    title: "LC 416 · Partition Equal Subset Sum"
    minutes: 5
    algo: lc-dp
    steps:
      - title: "The problem"
        body: "Split into two subsets with equal sums."
        input: "knap"
        check: { metric: manual }
      - title: "The pattern"
        body: "0/1 knapsack over sums: iterate sums downward so each number is used once."
        watch: "Reachable sums light up as numbers are added."
        check: { metric: manual }
      - title: "Cost"
        body: "O(n × sum/2)."
        check: { metric: manual }
