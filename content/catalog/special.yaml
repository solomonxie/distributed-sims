group: { id: special, label: Special, order: 12 }
types:
  - type: external-api
    label: External API
    description: Third-party dependency with SLA latency, error budget and account quota
    icon: plug
    costPerInstanceMonth: 0
    knobs:
      - { key: quotaRps, label: Quota, kind: int, default: 100, min: 1, max: 1000000, unit: rps, help: Over quota → 429 }
      - { key: availabilityPct, label: Availability SLA, kind: percent, default: 99.9, min: 50, max: 100 }
      - { key: instances, label: Instances, kind: int, default: 1, min: 1, max: 1 }
      - { key: slots, label: Concurrency, kind: int, default: 1000, min: 1, max: 100000, advanced: true }
      - { key: p50Ms, label: p50, kind: ms, default: 200, min: 1, max: 60000 }
      - { key: p99Ms, label: p99, kind: ms, default: 1200, min: 1, max: 120000 }
      - { key: queueLimit, label: Queue limit, kind: int, default: 1000, min: 0, max: 100000, advanced: true }
      - { key: costMonth, label: Cost / month, kind: number, default: 0, min: 0, max: 100000, unit: $ }
  - type: anti-corruption-layer
    label: Anti-corruption layer
    description: Translates between models, then passes the call through
    icon: languages
    costPerInstanceMonth: 40
    knobs:
      - { key: mappingErrPct, label: Mapping errors, kind: percent, default: 0, min: 0, max: 100 }
      - { key: instances, label: Instances, kind: int, default: 2, min: 1, max: 64 }
      - { key: slots, label: Slots, kind: int, default: 32, min: 1, max: 4096, advanced: true }
      - { key: p50Ms, label: Translate p50, kind: ms, default: 1, min: 0.01, max: 5000 }
      - { key: p99Ms, label: Translate p99, kind: ms, default: 5, min: 0.01, max: 30000 }
      - { key: queueLimit, label: Queue limit, kind: int, default: 1000, min: 0, max: 100000, advanced: true }
      - { key: costMonth, label: Cost / month, kind: number, default: 40, min: 0, max: 100000, unit: $ }
  - type: crdt-counter
    label: CRDT counter
    description: G/PN counter replica; anti-entropy merges replicas with no conflicts, even across partitions
    icon: diff
    costPerInstanceMonth: 60
    knobs:
      - { key: counter, label: Counter, kind: enum, default: pn, options: [g, pn], help: "g: increments only; pn: increments + decrements (two G-counters)" }
      - { key: decrementPct, label: Decrements, kind: percent, default: 20, min: 0, max: 100, help: PN only; share of writes that decrement }
      - { key: antiEntropyMs, label: Anti-entropy every, kind: ms, default: 500, min: 10, max: 60000 }
      - { key: cluster, label: Cluster, kind: string, default: default, advanced: true, help: Replicas with the same cluster name merge }
      - { key: instances, label: Instances, kind: int, default: 1, min: 1, max: 16 }
      - { key: slots, label: Slots, kind: int, default: 64, min: 1, max: 4096, advanced: true }
      - { key: p50Ms, label: p50, kind: ms, default: 0.5, min: 0.01, max: 1000 }
      - { key: p99Ms, label: p99, kind: ms, default: 3, min: 0.01, max: 5000 }
      - { key: queueLimit, label: Queue limit, kind: int, default: 1000, min: 0, max: 100000, advanced: true }
      - { key: costMonth, label: Cost / month, kind: number, default: 60, min: 0, max: 100000, unit: $ }
skins:
  - name: stripe
    type: external-api
    label: Stripe
    description: Payments API; 100 rps live-mode limit
    icon: credit-card
    tags: [saas, payments]
    defaults: { quotaRps: 100, p50Ms: 300, p99Ms: 1500, availabilityPct: 99.99 }   # source: Stripe docs, 100 read+write ops/s live mode
  - name: sendgrid
    type: external-api
    label: SendGrid
    description: Transactional email API
    icon: mail
    tags: [saas, email]
    defaults: { quotaRps: 600, p50Ms: 150, p99Ms: 800, availabilityPct: 99.95 }
  - name: apns
    type: external-api
    label: Apple Push (APNs)
    description: iOS push notification service over HTTP/2
    icon: bell
    tags: [push, apple]
    defaults: { quotaRps: 5000, p50Ms: 60, p99Ms: 400, availabilityPct: 99.9 }
  - name: twilio
    type: external-api
    label: Twilio SMS
    description: SMS API; per-number send rate limits
    icon: message-square
    tags: [saas, sms]
    defaults: { quotaRps: 100, p50Ms: 250, p99Ms: 1200, availabilityPct: 99.95 }
