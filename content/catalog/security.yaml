group: { id: security, label: Security, order: 9 }
# Services/gateways authenticate via engine helper authCheck(n, req, next) (behaviors/security.ts):
# session mode calls the IdP per request; JWT mode validates locally with cached JWKS.
# TLS: edges with `mtls: true` cost tlsCost(edge) ms CPU per request (record crypto + amortised handshakes).
types:
  - type: identity-provider
    label: Identity provider
    description: Issues tokens (login + MFA) and validates sessions; JWT vs session modes
    icon: fingerprint
    costPerInstanceMonth: 120
    knobs:
      - { key: mode, label: Token mode, kind: enum, default: jwt, options: [jwt, session], help: "session: every request asks the IdP; jwt: verified locally with cached keys" }
      - { key: tokenTtlSec, label: Token TTL, kind: int, default: 900, min: 10, max: 86400, unit: s, help: JWTs keep working this long if the IdP is down; revocations lag this long }
      - { key: jwksTtlSec, label: JWKS cache TTL, kind: int, default: 300, min: 1, max: 86400, unit: s, help: After key rotation, new tokens fail validation until caches refresh }
      - { key: denylist, label: Revocation denylist, kind: bool, default: false, help: Extra lookup per JWT so revoked tokens are rejected before expiry }
      - { key: mfaPct, label: Logins with MFA, kind: percent, default: 0, min: 0, max: 100 }
      - { key: mfaMs, label: MFA wait, kind: ms, default: 8000, min: 100, max: 120000, advanced: true, help: User completing the second factor }
      - { key: loginP50Ms, label: Login p50, kind: ms, default: 80, min: 1, max: 5000, advanced: true, help: Password hashing (bcrypt) dominates }
      - { key: loginP99Ms, label: Login p99, kind: ms, default: 400, min: 1, max: 30000, advanced: true }
      - { key: instances, label: Instances, kind: int, default: 2, min: 1, max: 64 }
      - { key: slots, label: Slots, kind: int, default: 32, min: 1, max: 4096, advanced: true }
      - { key: p50Ms, label: Validate p50, kind: ms, default: 5, min: 0.1, max: 5000 }
      - { key: p99Ms, label: Validate p99, kind: ms, default: 30, min: 0.1, max: 30000 }
      - { key: queueLimit, label: Queue limit, kind: int, default: 1000, min: 0, max: 100000, advanced: true }
      - { key: costMonth, label: Cost / month, kind: number, default: 120, min: 0, max: 100000, unit: $ }
  - type: auth-middleware
    label: Auth middleware
    description: Checks each request's token (via its IdP edge) then forwards to one app edge
    icon: shield-check
    costPerInstanceMonth: 30
    knobs:
      - { key: authMode, label: Auth mode, kind: enum, default: inherit, options: [inherit, jwt, session], help: inherit = use the IdP's mode }
      - { key: jwtVerifyMs, label: JWT verify, kind: ms, default: 0.1, min: 0.01, max: 50, advanced: true, help: Local signature check (RS256) }
      - { key: denylistMs, label: Denylist lookup, kind: ms, default: 1, min: 0.1, max: 100, advanced: true }
      - { key: instances, label: Instances, kind: int, default: 2, min: 1, max: 64 }
      - { key: slots, label: Slots, kind: int, default: 64, min: 1, max: 4096, advanced: true }
      - { key: p50Ms, label: p50, kind: ms, default: 0.5, min: 0.05, max: 1000 }
      - { key: p99Ms, label: p99, kind: ms, default: 3, min: 0.05, max: 5000 }
      - { key: queueLimit, label: Queue limit, kind: int, default: 1000, min: 0, max: 100000, advanced: true }
      - { key: costMonth, label: Cost / month, kind: number, default: 30, min: 0, max: 100000, unit: $ }
  - type: kms
    label: KMS
    description: Key management; envelope encryption calls under a shared request quota
    icon: key-round
    costPerInstanceMonth: 1
    knobs:
      - { key: quotaRps, label: Request quota, kind: int, default: 5500, min: 1, max: 1000000, unit: rps, help: Over quota → 429 ThrottlingException }
      - { key: dataKeyCache, label: Data-key caching, kind: bool, default: false, help: Callers reuse a data key for many messages → far fewer KMS calls }
      - { key: keyReuse, label: Messages per data key, kind: int, default: 1000, min: 1, max: 1000000, advanced: true }
      - { key: reencryptObjects, label: Re-encrypt on rotation, kind: int, default: 100000, min: 0, max: 100000000, advanced: true, help: Objects re-wrapped after key rotation (uses half the quota) }
      - { key: instances, label: Instances, kind: int, default: 1, min: 1, max: 1 }
      - { key: slots, label: Slots, kind: int, default: 512, min: 1, max: 100000, advanced: true }
      - { key: p50Ms, label: p50, kind: ms, default: 3, min: 0.1, max: 1000 }
      - { key: p99Ms, label: p99, kind: ms, default: 15, min: 0.1, max: 5000 }
      - { key: queueLimit, label: Queue limit, kind: int, default: 1000, min: 0, max: 100000, advanced: true }
      - { key: costMonth, label: Cost / month, kind: number, default: 1, min: 0, max: 100000, unit: $ }
  - type: secrets-store
    label: Secrets store
    description: Serves credentials; rotation briefly leaves consumers with a stale secret
    icon: lock-keyhole
    costPerInstanceMonth: 5
    knobs:
      - { key: rotateEverySec, label: Auto-rotate every, kind: int, default: 0, min: 0, max: 31536000, unit: s, help: 0 = manual (key-rotation chaos) }
      - { key: rotationWindowSec, label: Stale-secret window, kind: number, default: 5, min: 0, max: 600, unit: s, help: Consumers holding the old version fail with auth errors }
      - { key: quotaRps, label: Request quota, kind: int, default: 10000, min: 1, max: 1000000, unit: rps }
      - { key: instances, label: Instances, kind: int, default: 1, min: 1, max: 16 }
      - { key: slots, label: Slots, kind: int, default: 256, min: 1, max: 100000, advanced: true }
      - { key: p50Ms, label: p50, kind: ms, default: 5, min: 0.1, max: 1000 }
      - { key: p99Ms, label: p99, kind: ms, default: 25, min: 0.1, max: 5000 }
      - { key: queueLimit, label: Queue limit, kind: int, default: 1000, min: 0, max: 100000, advanced: true }
      - { key: costMonth, label: Cost / month, kind: number, default: 5, min: 0, max: 100000, unit: $ }
skins:
  - name: auth0
    type: identity-provider
    label: Auth0
    description: Managed identity platform (Okta)
    icon: fingerprint
    tags: [managed, oidc]
    defaults: { mode: jwt, tokenTtlSec: 86400, jwksTtlSec: 600, p50Ms: 40, p99Ms: 200, costMonth: 240 }   # source: Auth0 default access-token lifetime 24h
  - name: cognito
    type: identity-provider
    label: Amazon Cognito
    description: AWS user pools; JWT access tokens
    icon: brand:aws
    tags: [aws, managed, oidc]
    defaults: { mode: jwt, tokenTtlSec: 3600, jwksTtlSec: 3600, p50Ms: 30, p99Ms: 150, costMonth: 55 }   # source: Cognito access token default 60 min
  - name: keycloak
    type: identity-provider
    label: Keycloak
    description: Open-source IAM; sessions or JWTs
    icon: fingerprint
    tags: [self-hosted, oidc]
    defaults: { mode: jwt, tokenTtlSec: 300, jwksTtlSec: 300, p50Ms: 8, p99Ms: 40, costMonth: 150 }   # source: Keycloak access token lifespan default 5 min
  - name: oauth2-proxy
    type: auth-middleware
    label: oauth2-proxy
    description: Reverse proxy that authenticates with an OIDC provider
    icon: shield-check
    tags: [self-hosted, proxy]
    defaults: { p50Ms: 0.5, p99Ms: 3, costMonth: 30 }
  - name: aws-kms
    type: kms
    label: AWS KMS
    description: Managed keys; shared per-account request quota
    icon: brand:aws
    tags: [aws, managed]
    defaults: { quotaRps: 5500, p50Ms: 3, p99Ms: 15, costMonth: 1 }   # source: AWS KMS symmetric crypto quota 5,500–100,000 rps by region
  - name: vault
    type: kms
    label: Vault Transit
    description: HashiCorp Vault encryption-as-a-service
    icon: vault
    tags: [self-hosted]
    defaults: { quotaRps: 20000, p50Ms: 1.5, p99Ms: 10, costMonth: 200 }
  - name: secrets-manager
    type: secrets-store
    label: AWS Secrets Manager
    description: Managed secrets with rotation lambdas
    icon: brand:aws
    tags: [aws, managed]
    defaults: { quotaRps: 10000, p50Ms: 8, p99Ms: 40, costMonth: 5 }   # source: GetSecretValue quota 10,000 rps
  - name: vault-secrets
    type: secrets-store
    label: Vault KV
    description: HashiCorp Vault key/value secrets
    icon: vault
    tags: [self-hosted]
    defaults: { quotaRps: 20000, p50Ms: 2, p99Ms: 12, costMonth: 200 }
