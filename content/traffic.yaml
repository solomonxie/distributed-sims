# Traffic shapes (engine TrafficShape) and quick-fire presets (engine TrafficEvent).
shapes:
  - kind: constant
    label: Constant
    icon: minus
    params:
      - { key: rps, label: Rate, kind: number, default: 1000, min: 0, max: 10000000, unit: rps }
  - kind: ramp
    label: Ramp
    icon: trending-up
    params:
      - { key: from, label: From, kind: number, default: 100, min: 0, max: 10000000, unit: rps }
      - { key: to, label: To, kind: number, default: 5000, min: 0, max: 10000000, unit: rps }
      - { key: overSec, label: Over, kind: number, default: 60, min: 1, max: 3600, unit: s }
  - kind: diurnal
    label: Diurnal
    icon: sun
    params:
      - { key: peak, label: Peak, kind: number, default: 5000, min: 0, max: 10000000, unit: rps }
      - { key: trough, label: Trough, kind: number, default: 500, min: 0, max: 10000000, unit: rps }
      - { key: periodSec, label: Day length, kind: number, default: 120, min: 10, max: 86400, unit: s }
  - kind: spike-train
    label: Spike train
    icon: audio-waveform
    params:
      - { key: base, label: Base, kind: number, default: 500, min: 0, max: 10000000, unit: rps }
      - { key: height, label: Spike height, kind: number, default: 5000, min: 0, max: 10000000, unit: rps }
      - { key: periodSec, label: Period, kind: number, default: 30, min: 1, max: 3600, unit: s }
      - { key: widthSec, label: Spike width, kind: number, default: 3, min: 0.1, max: 600, unit: s }
presets:
  - id: burst
    label: Burst 20× 5s
    icon: zap
    emoji: "⚡"
    event: { action: burst, params: { x: 20 }, durationSec: 5 }
  - id: ramp
    label: Ramp ×3 30s
    icon: trending-up
    emoji: "📈"
    event: { action: ramp, params: { x: 3 }, durationSec: 30 }
  - id: flash-crowd
    label: Flash crowd
    icon: party-popper
    emoji: "🎟"
    event: { action: flash-crowd, params: { x: 100 }, durationSec: 20 }
  - id: hot-key
    label: Hot key 40%
    icon: flame
    emoji: "🔑"
    event: { action: hot-key, params: { hot: 0.4 }, durationSec: 30 }
  - id: bots
    label: Bots
    icon: bot
    emoji: "🤖"
    event: { action: bots, params: { rps: 5000 }, durationSec: 15 }
  - id: herd
    label: Herd
    icon: users
    emoji: "🐃"
    event: { action: herd, params: { x: 30 }, durationSec: 2 }
